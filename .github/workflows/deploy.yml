# Deploy automático no GitHub Pages a cada push na branch main.
# O build usa --base=./ (caminhos relativos), então o mesmo artefato funciona
# tanto em https://USUARIO.github.io quanto em https://USUARIO.github.io/REPO/.
name: Deploy — GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # --base=./ sobrescreve o base do Vite sem tocar no vite.config.js:
      # gera referências relativas (./assets/...) que funcionam em qualquer subcaminho.
      - name: Build (base relativo)
        run: npm run build -- --base=./

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Upload do artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
